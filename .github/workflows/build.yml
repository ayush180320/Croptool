name: Build Pro Windows App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' 

    - name: Download FFmpeg (Windows Static)
      run: |
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
        Copy-Item "ffmpeg_extracted\*\bin\ffmpeg.exe" -Destination ".\ffmpeg.exe"

    - name: Build and Publish Single Embedded Exe
      run: >
        dotnet publish 
        -c Release 
        -r win-x64 
        --self-contained true 
        -p:PublishSingleFile=true 
        -p:IncludeNativeLibrariesForSelfExtract=true 
        -o ./publish_output

    - name: Upload the .exe
      uses: actions/upload-artifact@v4
      with:
        name: Pro-Video-Cropper-Exe 
        path: ./publish_output/
